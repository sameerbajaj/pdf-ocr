[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ocr-cli"
version = "1.0.0"
description = "High-quality OCR tool for scanned PDFs using Tesseract"
authors = [
    {name = "Sameer Bajaj", email = "sameer@sameerbajaj.com"}
]
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["ocr", "pdf", "tesseract", "document-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pytesseract>=0.3.13",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyPDF2>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
pdf-ocr = "pdf_ocr_tool.cli:main"
pdf-ocr-cli = "pdf_ocr_tool.cli:main"

[tool.setuptools]
packages = ["pdf_ocr_tool"]
py-modules = ["pdf_ocr_cli"]

[project.urls]
Homepage = "https://sameerbajaj.com/tools/pdf-ocr/"
Website = "https://sameerbajaj.com"
Repository = "https://github.com/sameerbajaj/pdf-ocr"
